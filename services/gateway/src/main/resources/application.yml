server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${stockpredict.gateway.allowed-origins}
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/.well-known/jwks.json
        - id: market-data
          uri: ${MARKET_DATA_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/stocks/**
        - id: prediction
          uri: ${PREDICTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/predictions/**
        - id: ranking
          uri: ${RANKING_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/recommendations/**
        - id: paper-trading
          uri: ${PAPER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/paper/**

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info

stockpredict:
  gateway:
    allowed-origins: ${STOCKPREDICT_GATEWAY_ALLOWED_ORIGINS:*}
  jwt:
    issuer: ${STOCKPREDICT_JWT_ISSUER:https://auth.stockpredict.local}
    audience: ${STOCKPREDICT_JWT_AUDIENCE:stockpredict-api}
    jwks-uri: ${STOCKPREDICT_JWT_JWKS_URI:http://localhost:8081/api/v1/.well-known/jwks.json}
    clock-skew: PT30S

logging:
  level:
    com.stockpredict: INFO
